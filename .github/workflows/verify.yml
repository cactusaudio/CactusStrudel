name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio/render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned Strudel renderer source
        run: |
          git clone https://codeberg.org/uzu/strudel.git refs/strudel-monorepo
          cd refs/strudel-monorepo
          git checkout f73b395648645aabe699f91ba0989f35a6fd8a3c
          pnpm install --frozen-lockfile || {
            pnpm approve-builds --all
            pnpm install --frozen-lockfile
          }
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Repo truth gate
        run: ./scripts/verify-repo.sh
