name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system audio/render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Repo truth gate
        run: ./scripts/verify-repo.sh
